[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalbench"
version = "0.1.0"
description = "Evaluation harness that finds where small language models fail, not just how often."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Jain" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "transformers>=4.50",
  "accelerate>=1.0",
  "sentence-transformers>=3.0",
  "huggingface_hub>=0.30",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
evalbench = "evalbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalbench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models (deselect with -m 'not slow')"]
addopts = "-m 'not slow' -q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
